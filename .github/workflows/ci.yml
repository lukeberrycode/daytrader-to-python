# Checks every pull request and every push to main.
# "checks": lint and format. Unit tests join it when the new slice has code.
# "characterisation": builds the unmodified DayTrader 8 from the pinned submodule, starts it, and
# runs the characterisation tests against it. Later, the same tests run against the new slice.
# A second container runs the "fixtures" image (prices seeded in its database) for test_prices.py.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No version: setup-uv reads required-version from pyproject.toml.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check

  characterisation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # No version: setup-uv reads required-version from pyproject.toml.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - name: Build the legacy app
        run: docker build -t daytrader8-legacy -f legacy/docker/Dockerfile legacy
      - name: Start the legacy app
        run: |
          docker run -d --name legacy -p 127.0.0.1:9080:9080 daytrader8-legacy
          scripts/wait-for-legacy.sh
      - name: Build and start the fixtures image
        run: |
          docker build -t daytrader8-legacy-fixtures --target fixtures -f legacy/docker/Dockerfile legacy
          docker run -d --name fixtures -p 127.0.0.1:9081:9080 daytrader8-legacy-fixtures
          LEGACY_URL=http://localhost:9081/daytrader scripts/wait-for-legacy.sh
      - name: Characterisation tests (legacy)
        env:
          FIXTURES_URL: http://localhost:9081/daytrader
        run: uv run pytest tests/characterisation
      - name: Legacy server logs
        if: failure()
        run: |
          docker logs legacy
          docker logs fixtures
