# Checks every pull request and every push to main.
# "checks": lint and format. Unit tests join it when the new slice has code.
# "characterisation": builds the unmodified DayTrader 8 from the pinned submodule, starts it, and
# runs the characterisation tests against it. Later, the same tests run against the new slice.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check

  characterisation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - name: Build the legacy app
        run: docker build -t daytrader8-legacy -f legacy/docker/Dockerfile legacy
      - name: Start the legacy app
        run: |
          docker run -d --name legacy -p 9080:9080 daytrader8-legacy
          scripts/wait-for-legacy.sh
      - name: Characterisation tests (legacy)
        run: uv run pytest tests/characterisation
      - name: Legacy server log
        if: failure()
        run: docker logs legacy
